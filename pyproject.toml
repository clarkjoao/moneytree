[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moneytree"
version = "0.1.0"
description = "Controle financeiro pessoal — parsing de PDFs Itaú"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3",
    "pdfplumber>=0.11",
    "markitdown[pdf]>=0.0.1",
    "pypdf>=4.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["models", "parsers", "classifier", "transaction_store", "analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
